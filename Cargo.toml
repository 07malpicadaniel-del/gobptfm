[workspace]
resolver = "2"
members = [
    "crates/gov-domain",
    "crates/gov-proto",
    "crates/gov-ledger",
    "crates/gov-tax-engine",
    "crates/gov-receipt",
    "crates/gov-core-api",
    "crates/gov-edge-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
# Runtime & Async
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Web & gRPC
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
tonic = { version = "0.12", features = ["tls", "gzip"] }
prost = "0.13"

# Serialización & Dominio Financiero
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde-with-str", "maths", "db-postgres"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

# Persistencia Nube & Local
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redb = "2.1"

# Criptografía & Reglas
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
rhai = { version = "1.19", features = ["sync", "decimal", "serde", "no_float"] }

# Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
float_arithmetic = "deny"
lossy_float_literal = "deny"

